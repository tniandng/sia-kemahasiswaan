<title>SIA Kemahasiswaan USD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: ponsel memakai menu bawah, layar lebar memakai sidebar kiri. Warna diambil dari logo USD: ungu-biru tua dan emas. */
:root{
  --bg:#f4f3f8; --surface:#ffffff; --fg:#1d1c33; --muted:#66658a; --line:#e2e0ee;
  --brand:#4a4a99; --brand-soft:#e9e8f7; --gold:#e9a817; --gold-soft:#fdf1d3;
  --ok:#1d7a52; --ok-soft:#dff3e9; --warn:#a15c07; --warn-soft:#fdeccd; --bad:#b3261e; --bad-soft:#fbe3e1;
  --font-display:"Bricolage Grotesque",system-ui,sans-serif; --font-body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141425; --surface:#1e1e36; --fg:#ecebfa; --muted:#a3a2c6; --line:#32325a;
  --brand:#a9a8ee; --brand-soft:#2b2b52; --gold:#f2b93b; --gold-soft:#3a3016;
  --ok:#5fd4a0; --ok-soft:#173b2d; --warn:#f2b45c; --warn-soft:#3d2d12; --bad:#ff9a92; --bad-soft:#4a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141425; --surface:#1e1e36; --fg:#ecebfa; --muted:#a3a2c6; --line:#32325a;
  --brand:#a9a8ee; --brand-soft:#2b2b52; --gold:#f2b93b; --gold-soft:#3a3016;
  --ok:#5fd4a0; --ok-soft:#173b2d; --warn:#f2b45c; --warn-soft:#3d2d12; --bad:#ff9a92; --bad-soft:#4a1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
main{min-width:0;padding:16px 0 110px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.nav button,.side button.n{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:500;border-radius:10px}
.nav button svg,.side button.n svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--brand);font-weight:600}
.nav button[aria-current="page"] svg{stroke-width:2.3}
@media (min-width:900px){
  .app{grid-template-columns:250px 1fr;gap:32px}
  .nav{display:none}
  main{padding:28px 0 60px}
  .side{display:flex;flex-direction:column;gap:4px;padding:28px 0;position:sticky;top:0;align-self:start;height:100vh}
  .side .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:18px}
  .side button.n{flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;justify-content:flex-start;width:100%}
  .side button.n[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
}
.brand img{width:54px;height:auto}
.brand b{font-family:var(--font-display);color:var(--brand);font-size:17px;letter-spacing:.02em}
.brand small{color:var(--brand);font-weight:600;font-size:11.5px}
.hero{display:flex;flex-direction:column;align-items:center;margin:0 auto 6px;max-width:330px}
.hero svg{width:100%;height:auto;display:block}
.hero text{fill:var(--brand);font-family:var(--font-display);font-weight:700}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h1{font-size:22px;flex:1;min-width:0}
.back{background:var(--brand-soft);color:var(--brand);border:0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;margin-bottom:16px}
.search svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.search input{border:0;background:none;padding:12px 0;border-radius:0}
.search input:focus-visible{outline:0}
.search:focus-within{outline:2px solid var(--brand)}
.greet{font-size:24px;margin-bottom:2px}
.sub{color:var(--muted);font-size:13.5px}
.banner{background:var(--gold-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:12px 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px;font-size:13.5px}
.btn{background:var(--brand);color:var(--surface);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.btn.alt{background:var(--brand-soft);color:var(--brand)}
.btn.dng{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{font-size:15px;margin-bottom:8px}
.kpi{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1}
.kpi small{font-size:13px;font-weight:500;color:var(--muted);font-family:var(--font-body)}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.sec h2{font-size:17px}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--brand-soft);color:var(--brand);border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-width:0}
.list>.row:last-child{border-bottom:0}
button.row:hover{background:var(--brand-soft)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;color:var(--muted);font-size:13px}
.row .go{color:var(--muted);font-size:20px;line-height:1}
.star{background:none;border:0;font-size:20px;color:var(--muted);padding:0 4px;line-height:1}
.star.on{color:var(--gold)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:18px 2px 8px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:140px 1fr;gap:0}
.kv div{padding:11px 14px;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){color:var(--muted);font-size:13.5px}
.kv div:nth-last-child(-n+2){border-bottom:0}
.ktm{background:linear-gradient(135deg,var(--brand),#2d2d70);color:#fff;border-radius:16px;padding:18px;max-width:380px;position:relative;overflow:hidden}
.ktm::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--gold);opacity:.9}
.ktm img{width:46px;position:relative;z-index:1}
.ktm .nm{font-family:var(--font-display);font-size:21px;margin-top:22px}
.ktm .meta{opacity:.85;font-size:13.5px}
.queue{text-align:center;padding:26px 16px}
.queue .big{font-family:var(--font-display);font-size:42px;font-weight:700;color:var(--brand)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:14px auto;max-width:420px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .5s}
.ed .item{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;position:relative}
.ed label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.ed .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ed .del{grid-column:1/-1;justify-self:end;background:none;border:0;color:var(--bad);font-weight:600;font-size:13px;padding:0}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.empty{color:var(--muted);padding:18px;text-align:center}
.note{color:var(--muted);font-size:13px;margin:8px 2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" aria-label="Menu utama"></nav>

function tabScreen(tab,title,ph){
  const all=M.filter(m=>m.tab===tab&&m.id!=="data");

  const extra=tab==="akademik"?`<button class="btn" style="margin:4px 0 12px" data-go="antrean">Masuk KRS/BRS (antrean)</button>`:"";
  return `${topbar(title)}${searchBox(ph)}${extra}${body}`;
}

S.antrean=()=>{
  if(!qState)qState={pos:127,total:350,server:1+Math.floor(Math.random()*3)};
  const done=qState.pos<=0, pct=Math.round((1-Math.max(qState.pos,0)/qState.total)*100);
  return `${topbar("Sistem KRS/BRS","akademik")}<div class="card queue"><div class="sub">${done?"Giliranmu tiba":"Anda berada dalam antrean"}</div><div class="big" id="qpos">${done?"Silakan masuk":"Posisi "+qState.pos+" dari "+qState.total}</div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i id="qbar" style="width:${pct}%"></i></div><div class="sub" id="qsub">${done?"Akses dibuka di Server "+qState.server:"Sistem memproses akses · Estimasi "+Math.max(1,Math.ceil(qState.pos/40))+" menit"}</div><p class="note">Pengguna dibagi rata ke 3 server (load balancing). Kamu diarahkan ke Server ${qState.server}. Jangan tutup halaman ini.</p><button class="btn" id="qgo" ${done?"":"disabled"} data-go="krs">Masuk KRS</button></div><p class="note">Antrean ini simulasi untuk menunjukkan alur waiting room.</p>`};
function startQueue(){
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
    if(!qState||view!=="antrean"){clearInterval(timer);timer=null;return}
    qState.pos-=3+Math.floor(Math.random()*8);
    if(qState.pos<=0){qState.pos=0;clearInterval(timer);timer=null;qState=null;render();return}
    const pct=Math.round((1-qState.pos/qState.total)*100);
    const a=document.getElementById("qpos"),b=document.getElementById("qbar"),c=document.getElementById("qsub");
    if(a)a.textContent="Posisi "+qState.pos+" dari "+qState.total; if(b)b.style.width=pct+"%"; if(c)c.textContent="Sistem memproses akses · Estimasi "+Math.max(1,Math.ceil(qState.pos/40))+" menit";
  },900);
}

S.data=()=>{
  const lists=Object.entries(LISTS).map(([k,L])=>`<div class="sec"><h2>${L.t}</h2></div>${D[k].map((row,i)=>`<div class="item">${L.f.map(([f,lb])=>`<div><label for="${k}-${i}-${f}">${lb}</label><input id="${k}-${i}-${f}" data-p="${k}.${i}.${f}" value="${esc(row[f])}"></div>`).join("")}<button class="del" data-del="${k}.${i}">Hapus baris</button></div>`).join("")}<button class="btn alt" data-add="${k}">+ Tambah baris</button>`).join("");
  return `${topbar("Data saya","profil")}
  <p class="sub">Salin data dari SIA-mu ke sini. Semua layar prototype langsung memakai data ini. Data tersimpan di browser ini.</p>
  <div class="sec"><h2>Biodata</h2></div><div class="ed"><div class="fields">${PF.map(([f,lb])=>`<div><label for="p-${f}">${lb}</label><input id="p-${f}" data-p="profil.${f}" value="${esc(D.profil[f])}"></div>`).join("")}</div></div>
  <div class="ed">${lists}</div>
  <div class="sec"><h2>Pindahkan atau cadangkan</h2></div>
  <p class="note">Salin teks di bawah untuk mencadangkan, atau tempel data dari perangkat lain lalu tekan Terapkan.</p>
  <textarea id="json" aria-label="Data dalam format JSON">${esc(JSON.stringify(D,null,1))}</textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn alt" id="copy">Salin data</button><button class="btn" id="apply">Terapkan</button><button class="btn dng" id="reset">Kembalikan data contoh</button></div><div class="note" id="msg" aria-live="polite"></div>`;
};

/* ---------- Render & event ---------- */
function render(){
  const tab=tabOf(view);
  const nav=TABS.map(t=>`<button data-go="${t.id}" ${tab===t.id?'aria-current="page"':""}>${svg(t.i)}<span>${t.l}</span></button>`).join("");
  document.getElementById("nav").innerHTML=nav;
  document.getElementById("side").innerHTML=`${brandBlock()}${TABS.map(t=>`<button class="n" data-go="${t.id}" ${tab===t.id?'aria-current="page"':""}>${svg(t.i)}<span>${t.l}</span></button>`).join("")}`;
  let html;
  if(groupOf(view)&&!byId(view))html=S.group(view);
  else if(view!=="generic"&&view!=="group"&&typeof S[view]==="function")html=S[view]();
  else if(byId(view))html=S.generic(view);
  else{view="home";html=S.home()}
  document.getElementById("main").innerHTML=html;
  if(view==="antrean")startQueue();
}
function setPath(path,val){const[a,i,f]=path.split(".");if(f===undefined)D[a][i]=val;else if(isNaN(i))D[a][i][f]=val;else D[a][i][f]=val;D.isSample=false;save()}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-fav],[data-add],[data-del],#copy,#apply,#reset");if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.fav){const id=t.dataset.fav;FAV=FAV.includes(id)?FAV.filter(x=>x!==id):[...FAV,id];saveFav();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.dataset.add){const k=t.dataset.add,row={};LISTS[k].f.forEach(([f])=>row[f]="");D[k].push(row);D.isSample=false;save();render();return}
  if(t.dataset.del){const[k,i]=t.dataset.del.split(".");D[k].splice(Number(i),1);D.isSample=false;save();render();return}
  const msg=document.getElementById("msg");
  if(t.id==="copy"){const ta=document.getElementById("json");ta.value=JSON.stringify(D,null,1);ta.select();(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>msg.textContent="Data disalin.").catch(()=>msg.textContent="Teks sudah terpilih, salin dengan Ctrl+C.");return}
  if(t.id==="apply"){try{const o=JSON.parse(document.getElementById("json").value);if(!o.profil||!Array.isArray(o.jadwal))throw 0;D=o;D.isSample=false;save();render();document.getElementById("msg").textContent="Data diterapkan."}catch(x){msg.textContent="Format data tidak valid."}return}
  if(t.id==="reset"){if(t.dataset.sure){D=clone(SAMPLE);save();render();document.getElementById("msg").textContent="Data contoh dikembalikan."}else{t.dataset.sure=1;t.textContent="Yakin? Klik sekali lagi"}return}
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.p){const[a,b,c]=e.target.dataset.p.split(".");if(c===undefined)D[a][b]=e.target.value;else D[a][b][c]=e.target.value;D.isSample=false;save();return}
  if(e.target.id==="q"){q=e.target.value;const pos=e.target.selectionStart;
    if(view==="home"){const res=M.filter(m=>m.id!=="data"&&(m.label+" "+m.desc).toLowerCase().includes(q.toLowerCase()));
      let box=document.getElementById("hres");if(!box){box=document.createElement("div");box.id="hres";box.style.marginBottom="16px";document.querySelector(".search").after(box)}
      box.innerHTML=q?`<div class="note">${res.length} hasil</div>${menuList(res.slice(0,8))}`:"";return}
    render();const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
render();
</script>
